name: Edge effect test

# Builds the test app, runs it in an iOS simulator once per case, and publishes the screenshots.
# Start it from the Actions tab (Run workflow). It also runs when a claude/ branch changes the app or scripts.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Folder URL that holds the test pages (empty serves repro/ from this checkout)
        default: ''
      device:
        description: Simulator device
        default: iPhone 18 Pro Max
  push:
    branches: ['claude/**']
    paths: ['App/**', 'scripts/**', '.github/workflows/edge-effect-test.yml']

permissions:
  contents: write # publishes the screenshots on the results branch

concurrency:
  group: edge-effect-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_27.2.app ]; then sudo xcode-select -s /Applications/Xcode_27.2.app; fi
          sw_vers
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Build
        run: scripts/build.sh

      - name: Run the cases
        env:
          BASE_URL: ${{ inputs.base_url }}
          DEVICE_NAME: ${{ inputs.device || 'iPhone 18 Pro Max' }}
        run: scripts/run.sh

      - name: Measure where the effect ends
        continue-on-error: true
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pillow numpy
          .venv/bin/python scripts/measure.py out/*.png | tee out/measurements.txt

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: out/
          if-no-files-found: warn

      # A branch is easier to browse than an artifact zip: each run gets a run-N folder on "results".
      - name: Publish to the results branch
        if: always()
        run: |
          if [ -z "$(ls -A out 2>/dev/null)" ]; then echo "nothing to publish"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin results; then
            git worktree add -B results ../results FETCH_HEAD
          else
            git worktree add --orphan -b results ../results
          fi
          mkdir -p "../results/run-${GITHUB_RUN_NUMBER}"
          cp out/* "../results/run-${GITHUB_RUN_NUMBER}/"
          git -C ../results add -A
          git -C ../results commit -m "Results for run ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          git -C ../results push origin results
